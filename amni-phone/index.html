<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090B">
<title>Amni-Phone</title>
<link rel="icon" href="./assets/amni-phone.svg" type="image/svg+xml">
<link rel="preload" href="./assets/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./studio.css">
<script>try{const t=localStorage.getItem('amni-phone-theme');t&&document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<header>
  <div class="brand"><img src="./assets/amni-phone.svg" alt=""><b>AMNI-SCIENT</b><span>· Amni-Phone</span></div>
  <input id="design-name" type="text" aria-label="Design name" spellcheck="false">
  <select id="preset" aria-label="Load preset"></select>
  <div class="grow"></div>
  <div class="grp">
    <button class="btn ghost icon-btn" id="undo" type="button" aria-label="Undo" data-tip="Undo (Ctrl+Z)">↶</button>
    <button class="btn ghost icon-btn" id="redo" type="button" aria-label="Redo" data-tip="Redo (Ctrl+Shift+Z)">↷</button>
    <button class="btn" id="save" type="button" data-tip="Save to library (Ctrl+S)">Save</button>
    <button class="btn" id="library" type="button">Library</button>
    <button class="btn" id="import" type="button">Import</button>
    <button class="btn" id="export-json" type="button">Export JSON</button>
    <button class="btn ghost icon-btn" id="theme" type="button" aria-label="Toggle light and dark theme" data-tip="Light / dark">◐</button>
    <button class="btn ghost icon-btn" id="help" type="button" aria-label="Keyboard shortcuts" data-tip="Shortcuts (?)">?</button>
  </div>
  <input id="file" type="file" accept="application/json,.json" hidden>
</header>
<div id="metrics" role="status" aria-live="polite"></div>
<div id="main">
  <nav id="rail" aria-label="Design steps"></nav>
  <aside id="panel" aria-label="Step settings"></aside>
  <main id="stage">
    <div id="tabs" role="tablist"></div>
    <section class="view on" id="v-3d" role="tabpanel">
      <canvas id="view" aria-label="3D model"></canvas>
      <div id="hint">drag orbit · right-drag pan · wheel zoom · click a part, then drag it · R rotate · PgUp/PgDn height · ? help</div>
      <div class="legend" id="legend"></div>
      <div class="toolbar" id="toolbar"></div>
    </section>
    <section class="view" id="v-tiles" role="tabpanel"></section>
    <section class="view" id="v-layout" role="tabpanel"></section>
    <section class="view" id="v-stack" role="tabpanel"></section>
    <section class="view" id="v-drawing" role="tabpanel"></section>
    <section class="view" id="v-board" role="tabpanel"></section>
    <section class="view" id="v-report" role="tabpanel"></section>
    <section class="view" id="v-sourcing" role="tabpanel"></section>
    <section class="view" id="v-build" role="tabpanel"></section>
    <section class="view" id="v-compare" role="tabpanel"></section>
    <section class="view" id="v-bench" role="tabpanel"></section>
    <section class="view" id="v-sources" role="tabpanel"></section>
  </main>
  <aside id="side" aria-label="Checks and inspector"></aside>
</div>
<dialog id="dlg"><div class="dh"><b id="dlg-title"></b><button class="btn ghost icon-btn" id="dlg-close" type="button" aria-label="Close">✕</button></div><div class="db" id="dlg-body"></div></dialog>
<div id="toast" role="status"></div>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three/build/three.module.js",
    "three/addons/": "./lib/three/examples/jsm/",
    "three-bvh-csg": "./lib/three-bvh-csg/index.js",
    "three-mesh-bvh": "./lib/three-mesh-bvh/index.js"
  }
}
</script>
<script type="module" src="./studio.js"></script>
</body>
</html>
