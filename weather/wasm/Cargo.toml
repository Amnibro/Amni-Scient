[package]
name = "amni_weather_wasm"
version = "1.0.0"
edition = "2021"
description = "Amni-Weather field engine — colormaps, IDW, meteo derived vars"
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
[lib]
crate-type = ["cdylib"]
[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
[profile.dev]
debug = 0
incremental = false
