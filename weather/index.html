<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Amni-Weather — Live Maps · Satellite · OSM</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">

<meta name="description" content="Amni-Weather: real satellite, OpenStreetMap & CARTO basemaps with multi-layer weather, customizable colormaps, smooth pan/zoom. Same tile stack as Amni-Drive.">
<meta name="keywords" content="amni-weather,openstreetmap,esri satellite,carto,weather map,open-meteo,colormap">
<link rel="canonical" href="https://amni-scient.com/weather/">
<script>
(function(){var p=location.pathname;if(p.slice(-1)!=='/'&&!/\.[a-zA-Z0-9]+$/.test(p))location.replace(p+'/'+location.search+location.hash);})();
</script>
<base href="/weather/">
<link rel="stylesheet" href="/weather/style.css">
<style>html,body{margin:0;background:#02060e;color:#d4e8f8}#boot-err{display:none;position:fixed;left:12px;right:12px;bottom:90px;z-index:99;padding:12px;background:rgba(80,20,20,.92);border:1px solid #f66;border-radius:8px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<a id="home-link" href="/amni-weather.html">← Product page</a>
<div id="stage">
<canvas id="map"></canvas>
<canvas id="overlay"></canvas>
<canvas id="wind"></canvas>
<canvas id="haz"></canvas>
</div>
<div id="hover-chip" class="hover-chip" aria-live="polite"></div>
<div id="boot-err"></div>
<div class="zoom-fab">
<button type="button" id="zin" aria-label="Zoom in">+</button>
<button type="button" id="zout" aria-label="Zoom out">−</button>
</div>
<div class="hud" id="topbar">
<div class="pnl" id="brand">
<h1>Amni-Weather</h1>
<div class="sub">pack · carto dark · hazards · reports</div>
</div>
<div class="pnl" id="search-wrap">
<input id="q" type="search" placeholder="City or lat,lon…" autocomplete="off" spellcheck="false">
<button id="btn-search" type="button">Find</button>
</div>
<div class="pnl" id="mode-wrap">
<button id="go-pack" type="button" class="on" title="Prebaked field pack — no API">Pack</button>
<button id="go-live" type="button" title="Open-Meteo (rate limited)">Live</button>
<button id="go-demo" type="button">Demo</button>
<button id="btn-refresh" type="button" title="Reload pack / live">↻</button>
</div>
</div>
<div class="hud pnl" id="layers">
<h2>Basemap</h2>
<div class="layer-grid" id="basemap-row"></div>
<h2>Weather layers</h2>
<div class="layer-grid" id="layer-grid"></div>
<div id="controls">
<div class="ctrl-row">
<label>Colormap preset</label>
<select id="preset"></select>
</div>
<div class="ctrl-row">
<label>Color stops</label>
<div id="stops-row" class="stops"></div>
</div>
<div class="ctrl-row">
<label>Opacity <span id="op-val">68%</span></label>
<input id="opacity" type="range" min="5" max="100" value="68">
</div>
<div class="ctrl-row">
<label>Gamma <span id="gamma-val">1.00</span></label>
<input id="gamma" type="range" min="0.4" max="2.4" value="1" step="0.05">
</div>
<div class="ctrl-row">
<label>Soft mask <span id="soft-val">auto</span></label>
<input id="soft" type="range" min="0" max="1" value="0" step="0.05">
</div>
<div class="ctrl-row">
<label>Range min <span id="rmin-l">auto</span></label>
<input id="rmin" type="range" min="-50" max="50" value="-20" step="0.5">
</div>
<div class="ctrl-row">
<label>Range max <span id="rmax-l">auto</span></label>
<input id="rmax" type="range" min="-40" max="120" value="40" step="0.5">
</div>
<label class="chk"><input id="wind-on" type="checkbox" checked> Wind streamlines</label>
<label class="chk"><input id="iso-on" type="checkbox"> Pressure striations</label>
<label class="chk"><input id="haz-on" type="checkbox" checked> Active hazards</label>
<label class="chk"><input id="hover-on" type="checkbox" checked> Hover probe</label>
<label class="chk"><input id="reverse" type="checkbox"> Reverse palette</label>
<label class="chk"><input id="autorange" type="checkbox" checked> Auto range</label>
<label class="chk"><input id="smooth" type="checkbox" checked> Field smooth</label>
<h2>Report @ probe / map center</h2>
<div class="ctrl-row"><label>Type</label><select id="rep-type"></select></div>
<div class="ctrl-row"><label>Note</label><input id="rep-note" type="text" maxlength="160" placeholder="Optional short note"></div>
<button type="button" id="btn-report" class="lbtn" style="width:100%;margin-top:4px">Submit report</button>
<div id="haz-count" class="haz-count">hazards loading…</div>
<div class="ctrl-row">
<label>Units</label>
<div id="units" class="seg">
<button type="button" data-u="si" class="active">SI</button>
<button type="button" data-u="us">US</button>
</div>
</div>
</div>
</div>
<div class="hud pnl" id="legend">
<div class="title" id="leg-title">Temperature 2 m</div>
<div id="leg-bar"></div>
<div id="leg-scale"><span id="leg-lo">—</span><span id="leg-hi">—</span></div>
</div>
<div class="hud pnl" id="probe">
<h3>Point probe</h3>
<div class="coords" id="probe-coords">—</div>
<div><span class="val" id="probe-val">—</span><span class="unit" id="probe-unit"></span></div>
<div class="meta" id="probe-meta"></div>
</div>
<div class="hud" id="hint">drag pan · scroll zoom · tap probe</div>
<div class="hud pnl" id="timebar">
<div class="row">
<button id="t-prev" type="button">◀</button>
<input id="t-slider" type="range" min="0" max="167" value="0">
<button id="t-next" type="button">▶</button>
<button id="t-play" type="button">Play</button>
</div>
<div class="tlabel" id="t-label">Now</div>
</div>
<div class="hud pnl" id="status"><span id="status-text">Booting…</span></div>
<div id="attr">Imagery © Esri · Amni-Weather</div>
<script>
window.__wxBootErr=function(e){var el=document.getElementById('boot-err');var st=document.getElementById('status-text');var msg=(e&&e.message)?e.message:String(e);if(el){el.style.display='block';el.textContent='Boot failed: '+msg+(e&&e.stack?'\n'+e.stack:'');}if(st)st.innerHTML='<span class="warn">Boot failed</span>';console.error(e);};
window.addEventListener('error',function(ev){window.__wxBootErr(ev.error||ev.message);});
window.addEventListener('unhandledrejection',function(ev){window.__wxBootErr(ev.reason);});
</script>
<script type="module" src="/weather/wx-boot.123.js"></script>
</body>
</html>
