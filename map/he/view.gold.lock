fn scale_bar() {
	let mpp = 40075016.686 * cos(y2lat(cy) * PI / 180.0) / world_size();
	let feet = [10, 20, 50, 100, 200, 500, 1000, 2000];
	let miles = [0.5, 1.0, 2.0, 5.0, 10.0, 20.0, 50.0, 100.0, 200.0, 500.0, 1000.0, 2000.0];
	var best = 0.0;
	var txt byte[>..] = [];
	for f in feet {
		let px = (f as real) * 0.3048 / mpp;
		if px <= 100.0 && px > best {
			best = px;
			txt.clear();
			format(txt, f, " ft");
		}
	}
	for m in miles {
		let px = m * 1609.344 / mpp;
		if px <= 100.0 && px > best {
			best = px;
			txt.clear();
			if m < 1.0 {
				format_flt(txt, m, 1);
				txt.append(" mi");
			} else {
				format(txt, m as int, " mi");
			}
		}
	}
	let wpx = round(best) as int;
	var key byte[>..] = [];
	format(key, txt, "|", wpx);
	if key == scale_txt { return; }
	scale_txt.clear();
	scale_txt.append(key);
	let el = web::el("scale");
	web::text(el, txt);
	web::style(el, "width", str(wpx, "px"));
}
