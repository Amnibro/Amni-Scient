		if ptr_index(id) < 0 { ptrs.push(Ptr { id: id as i32, x: ex, y: ey }); }
		anim = false;
		inertia = false;
		web::cls(map_el, "drag", true);
		if ptrs.len == 1 {
			down_x = ex;
			down_y = ey;
			down_t = web::now();
			moved = false;
			pressed = true;
			vx = 0.0;
			vy = 0.0;
			web::timer(550, T_LONG);
			long_id = 1;
		} else if ptrs.len == 2 {
			long_clear();
			moved = true;
			pressed = false;
			let p0 .= ptrs[0];
			let p1 .= ptrs[1];
			let ddx = p1.x - p0.x;
			let ddy = p1.y - p0.y;
			pinch_d = max(sqrt(ddx * ddx + ddy * ddy), 1.0);
			pinch_z = zoom;
			pinch_wx = px_wx((p0.x + p1.x) / 2.0);
			pinch_wy = px_wy((p0.y + p1.y) / 2.0);
		}
	} else if kind == T_PMOVE {
		let i = ptr_index(id);
		if i < 0 { return; }
		let p .= ptrs[i];
		if ptrs.len == 1 {
			let dx = ex - p.x;
			let dy = ey - p.y;
			let ws = world_size();
