			pressed = false;
			web::cls(map_el, "drag", false);
			long_clear();
			let now = web::now();
			if moved {
				if sqrt(vx * vx + vy * vy) > 0.25 && now - last_move < 70.0 {
					inertia = true;
					want_frames();
				}
			} else if now - down_t < 300.0 {
				let qx = tap_x - ex;
				let qy = tap_y - ey;
				if tap_t > 0.0 && now - tap_t < 300.0 && sqrt(qx * qx + qy * qy) < 30.0 {
					let z1 = clamp(zoom + 1.0, 1.0, 19.0);
					let ws1 = 512.0 * pow(2.0, z1);
					fly_to(px_wx(ex) - (ex - vw / 2.0) / ws1, px_wy(ey) - (ey - vh / 2.0) / ws1, z1, 250.0);
