				moved = true;
				long_clear();
			}
			let dtm = max(web::now() - last_move, 1.0);
			vx = 0.7 * dx / dtm + 0.3 * vx;
			vy = 0.7 * dy / dtm + 0.3 * vy;
			p.x = ex;
			p.y = ey;
			view_changed();
		} else if ptrs.len >= 2 {
			p.x = ex;
			p.y = ey;
			let p0 .= ptrs[0];
			let p1 .= ptrs[1];
			let ddx = p1.x - p0.x;
			let ddy = p1.y - p0.y;
			let d = max(sqrt(ddx * ddx + ddy * ddy), 1.0);
			zoom = clamp(pinch_z + log(d / pinch_d) / log(2.0), 1.0, 19.0);
			let ws = world_size();
			cx = pinch_wx - ((p0.x + p1.x) / 2.0 - vw / 2.0) / ws;
			cy = pinch_wy - ((p0.y + p1.y) / 2.0 - vh / 2.0) / ws;
			view_changed();
		}
	} else if kind == T_PUP {
		let i = ptr_index(id);
		if i < 0 { return; }
		remove_at(ptrs, i);
