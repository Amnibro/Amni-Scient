fn frame(t real) {
	frame_no++;
	let dtms = if last_ft == 0.0 { 16.0 } else { max(t - last_ft, 1.0) };
	if anim {
		let f = clamp((web::now() - a_t0) / a_ms, 0.0, 1.0);
		let e = if f < 0.5 { 4.0 * f * f * f } else { 1.0 - pow(-2.0 * f + 2.0, 3.0) / 2.0 };
		var d = a_x1 - a_x0;
		if d > 0.5 { d -= 1.0; }
		if d < -0.5 { d += 1.0; }
		cx = a_x0 + d * e;
		cy = a_y0 + (a_y1 - a_y0) * e;
		zoom = a_z0 + (a_z1 - a_z0) * e;
		if f >= 1.0 { anim = false; }
		view_changed();
	}
	if inertia {
		let ws = world_size();
		cx -= vx * dtms / ws;
		cy -= vy * dtms / ws;
		let fr = pow(0.95, dtms / 17.0);
		vx *= fr;
		vy *= fr;
		if sqrt(vx * vx + vy * vy) < 0.02 { inertia = false; }
		view_changed();
	}
	if dirty { update_tiles(); }
	render_some(9.0);
	scale_bar();
	if !anim && !inertia && ptrs.len == 0 && labels_stale && web::now() - last_move >= 150.0 { relabel(); }
	var waiting = false;
	for &v in vts {
		if v.used == frame_no && v.state == 0 {
			let di = vt_dt(v.z, v.x, v.y);
			if di >= 0 && dts[di].state == 2 { waiting = true; }
		}
	}
	if !(anim || inertia || ptrs.len > 0 || labels_stale || dirty || waiting) {
		web::frames(false);
		frames_on = false;
	}
	last_ft = t;
}
