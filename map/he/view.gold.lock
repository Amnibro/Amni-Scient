fn on_key() {
	var k byte[>..] = [];
	web::ev_key(k);
	let ws = world_size();
	if k == "+" || k == "=" {
		fly_to(cx, cy, clamp(zoom + 1.0, 1.0, 19.0), 250.0);
		web::ev_prevent();
	} else if k == "-" || k == "_" {
		fly_to(cx, cy, clamp(zoom - 1.0, 1.0, 19.0), 250.0);
		web::ev_prevent();
	} else if k == "ArrowLeft" {
		fly_to(cx - 100.0 / ws, cy, zoom, 200.0);
		web::ev_prevent();
	} else if k == "ArrowRight" {
		fly_to(cx + 100.0 / ws, cy, zoom, 200.0);
		web::ev_prevent();
	} else if k == "ArrowUp" {
		fly_to(cx, cy - 100.0 / ws, zoom, 200.0);
		web::ev_prevent();
	} else if k == "ArrowDown" {
		fly_to(cx, cy + 100.0 / ws, zoom, 200.0);
		web::ev_prevent();
	}
}
