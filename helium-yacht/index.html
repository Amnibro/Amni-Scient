<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Helium Yacht — Live in Your Browser | AMNI-SCIENT</title>
<meta name="description" content="Steer a yacht across a live ocean. Every pixel is drawn by the Helium engine running in your browser on WebGPU.">
<link rel="canonical" href="https://amni-scient.com/helium-yacht/">
<style>
:root{--ink:#e8f4f7;--dim:rgba(232,244,247,.62);--glass:rgba(6,30,36,.62);--rim:rgba(255,255,255,.17);--mint:#7ff2c7}
html,body{margin:0;height:100%;background:#04161b;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
#top{position:fixed;top:max(52px,7vh);left:16px;display:flex;gap:8px;z-index:2}
#top a{color:var(--ink);text-decoration:none;background:var(--glass);border:1px solid var(--rim);border-radius:99px;padding:5px 12px;font-size:12px;backdrop-filter:blur(7px)}
#msg{position:fixed;inset:0;display:grid;place-items:center;z-index:3;padding:16px;text-align:center;pointer-events:none}
#msg div{max-width:460px;background:var(--glass);border:1px solid var(--rim);border-radius:17px;padding:21px 24px;backdrop-filter:blur(7px);pointer-events:auto}
#msg b{display:block;font-size:18px;margin-bottom:7px}
#msg p{margin:0;color:var(--dim)}
#msg a{color:var(--mint)}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .2s}
@media (max-width:560px){#top{top:12px}}
#vid{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;object-fit:cover;display:none;z-index:1;background:#04161b}
#msg.fb{place-items:end center;padding-bottom:max(24px,env(safe-area-inset-bottom))}
#turn{display:none}@media (orientation:portrait) and (max-width:700px){#turn{display:block;position:fixed;left:50%;top:42%;transform:translateX(-50%);z-index:2;background:var(--glass);border:1px solid var(--rim);border-radius:99px;padding:7px 14px;font-size:13px;pointer-events:none;white-space:nowrap;animation:fade 7s forwards}}@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<canvas data-helium tabindex="0"></canvas>
<video id="vid" muted loop playsinline preload="none" poster="v/poster.jpg" aria-label="A recording of the Helium yacht under way on open water"></video>
<div id="turn">Turn your phone sideways for the full view</div>
<nav id="top"><a href="/helium-graphics.html">About Helium graphics</a></nav>
<section id="msg"><div><b>Starting the engine…</b><p id="say">Downloading the Helium yacht (about 2 MB).</p><div class="bar"><i id="pct"></i></div></div></section>
<script type="module">
const msg = document.getElementById('msg'), say = document.getElementById('say'), pct = document.getElementById('pct');
const vid = document.getElementById('vid');
const stop = (t, p) => { msg.querySelector('b').textContent = t; say.innerHTML = p; pct.parentNode?.remove(); msg.style.display = ''; msg.classList.add('fb'); document.querySelector('canvas').style.display = 'none'; vid.src = 'v/yacht.mp4'; vid.style.display = 'block'; vid.play().catch(() => {}); };
const live = ' Here’s a recording instead. It runs live in Chrome or Edge on Windows, Mac, Linux and Android. <a href="/helium-graphics.html">More about Helium graphics</a>.';
let fb = false; const ad = navigator.gpu ? await navigator.gpu.requestAdapter().catch(() => null) || (fb = true, await navigator.gpu.requestAdapter({ featureLevel: 'compatibility' }).catch(() => null)) : null;
const wgl = !ad && (() => { try { const c = document.createElement('canvas').getContext('webgl2'), ok = !!c?.getExtension('EXT_color_buffer_float'); c?.getExtension('WEBGL_lose_context')?.loseContext(); return ok; } catch { return false; } })();
const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || /Macintosh/.test(ua) && navigator.maxTouchPoints > 1, saf = /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR/.test(ua), ff = /Firefox/.test(ua), lin = /Linux/.test(ua) && !/Android/.test(ua);
const why = !ad && !wgl || !WebAssembly.Suspending ? (ios ? 'On iPhone and iPad every browser is built on Safari, which can’t run the live engine yet.' : saf ? 'Safari can’t run the live engine yet.' : ff ? 'Firefox can’t run the live engine yet.' : lin && navigator.gpu ? 'Chrome on Linux keeps WebGPU, the graphics feature this needs, switched off for most graphics cards.' : 'This browser can’t run the live engine yet.') : '';
if (why) stop('This browser can’t run it live', why + live);
else {
  const F = ['Inter-Medium', 'Inter-Regular', 'Inter-SemiBold', 'InterDisplay-Medium', 'InterDisplay-Light'];
  const files = {}; let done = 0;
  await Promise.all(F.map(async n => { files['/f/' + n + '.ttf'] = new Uint8Array(await (await fetch('f/' + n + '.ttf')).arrayBuffer()); pct.style.width = (++done * 12) + '%'; }));
  say.textContent = 'Building the yacht and the ocean…'; pct.style.width = '80%';
  const touch = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0 && innerWidth < 1100; const cv = document.querySelector("canvas"); let gs = 0; const seen = () => gs + (globalThis.heFrames || 0), gt = globalThis.GPUCanvasContext?.prototype.getCurrentTexture; if (gt) GPUCanvasContext.prototype.getCurrentTexture = function () { gs++; return gt.call(this); };
  const um = new URLSearchParams(location.search).get('m'), m0 = (+um || (touch ? 2949 : 896)) | (ad && fb && !ad.features.has('core-features-and-limits') ? 4096 : 0) | (!ad && wgl ? 8192 : 0);
  try {
    const { start } = await import('./helium.js?v=6');
    const rt = await start({ wasm: 'yacht.wasm?v=10', canvas: cv, files, args: ['yacht', 'live', String(m0), '/f/', String(Math.round((devicePixelRatio || 1) * 100)), touch ? '1' : '0'], onerror: e => stop('The engine stopped', 'Something went wrong on this device: ' + String(e?.message || e).slice(0, 160) + '.' + live) });
    const wait = () => seen() > 1 ? (msg.style.display = "none", cv.focus(), um || m0 & 2048 || setTimeout(() => { const s0 = seen(), h0 = document.hidden; setTimeout(() => !h0 && !document.hidden && (seen() - s0) / 4 < 20 && location.replace('?m=' + (m0 | 2949)), 4000); }, 4000)) : requestAnimationFrame(wait); requestAnimationFrame(wait);
    rt.done.then(() => seen() < 2 && stop('The engine stopped', 'The graphics card on this device wouldn’t start the engine.' + live)).catch(e => stop('The engine stopped', String(e?.message || e).slice(0, 160) + '.' + live));
  } catch (e) { stop('Your graphics card said no', 'It couldn’t start the engine: ' + String(e?.message || e).slice(0, 160) + '.' + live); }
}
</script>
</body>
</html>
