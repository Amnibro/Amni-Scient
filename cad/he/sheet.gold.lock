fn radial(f int, x real, y real, z real) {
	let b = 16 * f;
	let dx = x - FC[b + 1];
	let dy = y - FC[b + 2];
	let dz = z - FC[b + 3];
	let ax = FC[b + 4];
	let ay = FC[b + 5];
	let az = FC[b + 6];
	let d = dx * ax + dy * ay + dz * az;
	var rx = dx - d * ax;
	var ry = dy - d * ay;
	var rz = dz - d * az;
	let l = sqrt(rx * rx + ry * ry + rz * rz);
	if l > 0.0 {
		rx /= l;
		ry /= l;
		rz /= l;
	}
