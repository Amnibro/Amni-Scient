export fn lb_step(tau real, u real, cs real, acc i32) {
	if FB.len == 0 {
		FB.resize(19 * N, 0.0);
		FRC.resize(3 * N, 0.0);
		MAC.resize(4 * N, 0.0);
		AVG.resize(4 * N, 0.0);
		lb_view_f32(3, FRC);
		lb_view_f32(4, MAC);
		lb_view_f32(5, AVG);
	}
	if CUR == 0 {
		lb_core(FA, FB, tau, u, cs, acc);
	} else {
		lb_core(FB, FA, tau, u, cs, acc);
	}
}
