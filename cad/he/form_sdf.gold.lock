export fn fs_skin(np i32, nb i32, nv i32, size real) {
	let npp = np as int;
	let nbb = nb as int;
	let nvv = nv as int;
	for v in 0..nvv {
		let x = POS[3 * v] as real;
		let y = POS[3 * v + 1] as real;
		let z = POS[3 * v + 2] as real;
		var dmin = 1e18;
		var pm = 0;
		var soft = 1e18;
		for p in 0..npp {
			DP[p] = jmax(shp(KP[3 * p] as int, x, y, z), 0.0);
			if DP[p] < dmin {
				dmin = DP[p];
				pm = p;
			}
			if KP[3 * p + 2] == 0 && DP[p] < soft { soft = DP[p]; }
		}
		if npp == 0 || KP[3 * pm + 2] != 0 {
			if npp > 0 {
				JN[4 * v] = KP[3 * pm + 1];
			} else {
				JN[4 * v] = 0;
			}
			WT[4 * v] = 1.0;
			continue;
		}
		for i in 0..nbb {
			AC[i] = 0.0;
		}
		for p in 0..npp {
			if KP[3 * p + 2] != 0 { continue; }
			let sg = jmax(KK[p] * 0.6, size * 0.012);
			let bo = KP[3 * p + 1] as int;
			if bo >= 0 && bo < nbb {
				AC[bo] = AC[bo] + fs_exp((-(DP[p] - soft)) / sg);
			}
		}
		let cnt = min(4, nbb);
		for c in 0..cnt {
			var best = -1;
			for i in 0..nbb {
				var skip = false;
				for t in 0..c {
					if (TOP[t] as int) == i { skip = true; }
				}
				if skip { continue; }
				if best == -1 || AC[i] > AC[best] { best = i; }
			}
			TOP[c] = best as i32;
		}
		var sumw = 0.0;
		for c in 0..cnt {
			sumw = sumw + AC[TOP[c] as int];
		}
		for c in 0..cnt {
			JN[4 * v + c] = TOP[c];
			var w = 0.0;
			if !bad(sumw) {
				w = AC[TOP[c] as int] / sumw;
			} else if c == 0 {
				w = 1.0;
			}
			WT[4 * v + c] = w as! f32;
		}
	}
	fs_view_i32(17, JN);
	fs_view_f32(18, WT);
}
