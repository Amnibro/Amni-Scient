fn segd(px real, py real, pz real, j int, m int) real {
    let a = 3 * (j * NK + m);
    let ax = EP[a];
    let ay = EP[a + 1];
    let az = EP[a + 2];
    let dx = EP[a + 3] - ax;
    let dy = EP[a + 4] - ay;
    let dz = EP[a + 5] - az;
    let vx = px - ax;
    let vy = py - ay;
    let vz = pz - az;
    let l2 = dx * dx + dy * dy + dz * dz;
    var w = 0.0;
    if l2 > 1e-30 {
        w = (vx * dx + vy * dy + vz * dz) / l2;
        if w < 0.0 {
            w = 0.0;
        }
        if w > 1.0 {
            w = 1.0;
        }
    }
    let qx = px - (ax + w * dx);
    let qy = py - (ay + w * dy);
    let qz = pz - (az + w * dz);
    return sqrt(qx * qx + qy * qy + qz * qz);
}
