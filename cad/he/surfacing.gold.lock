    var i = 0;
    while i < NE {
        var a = 0;
        while a < 3 {
            var lo = EP[3 * (i * NK) + a];
            var hi = lo;
            var m = 1;
            while m < NK {
                let v = EP[3 * (i * NK + m) + a];
                if v < lo {
                    lo = v;
                }
                if v > hi {
                    hi = v;
                }
                m += 1;
            }
            BB[6 * i + a] = lo;
            BB[6 * i + 3 + a] = hi;
            a += 1;
        }
        i += 1;
    }
    i = 0;
    while i < NE {
        var gap = 0.0;
        var near = -1;
        var m = 0;
        while m < NK {
            let p = 3 * (i * NK + m);
            let px = EP[p];
            let py = EP[p + 1];
            let pz = EP[p + 2];
            var best = 1e300;
            var bj = -1;
            var j = 0;
            while j < NE {
                if j != i {
                    if boxd(px, py, pz, j) < best {
