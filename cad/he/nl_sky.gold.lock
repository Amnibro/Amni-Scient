fn hypot3(a real, b real, c real) real {
	var vs real[3] = [abs(a), abs(b), abs(c)];
	var mx = 0.0;
	for x in vs {
		if x > mx {
			mx = x;
		}
	}
	if mx > 1.7976931348623157e308 {
		return mx;
	}
	for x in vs {
		if x != x {
			return x;
		}
	}
	if mx == 0.0 {
		return 0.0;
	}
	var sum = 0.0;
	var comp = 0.0;
	for x in vs {
		let q = x / mx;
		let summand = q * q - comp;
		let prelim = sum + summand;
		comp = (prelim - sum) - summand;
		sum = prelim;
	}
	sqrt(sum) * mx
}
