fn pnj(vn real, vo real, vt real, isat real) real {
    let vcrit = vt * log(vt / (sqrt(2.0) * isat));
    if (vn > vcrit && fabs(vn - vo) > 2.0 * vt) {
        var res real = 0.0;
        if (vo > 0.0) {
            let a = 1.0 + (vn - vo) / vt;
            if (a > 0.0) {
                res = vo + vt * log(a);
