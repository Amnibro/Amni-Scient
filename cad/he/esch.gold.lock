fn segdist(px real, py real, ax real, ay real, bx real, by real) real {
	let dx = bx - ax;
	let dy = by - ay;
	let l2 = dx * dx + dy * dy;
	var t = 0.0;
	if l2 >= 1e-18 {
		t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0.0, 1.0);
	}
	let ex = px - (ax + t * dx);
	let ey = py - (ay + t * dy);
	sqrt(ex * ex + ey * ey)
}
