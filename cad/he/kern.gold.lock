import math;
export fn kn_square(depth real, a real, cu real, cv real, tu real, tv real) i32 {
	let x = [F[3], F[4], F[5]];
	let n = [F[6], F[7], F[8]];
	let y = [n[1] * x[2] - n[2] * x[1], n[2] * x[0] - n[0] * x[2], n[0] * x[1] - n[1] * x[0]];
	var p = [0.0; 3];
	var c = [0.0; 3];
	var w = [0.0; 3];
	for i in 3 {
		p[i] = OUT[2 + i] + tu * x[i] + tv * y[i];
		c[i] = OUT[2 + i] + cu * x[i] + cv * y[i];
		w[i] = c[i] - p[i];
	}
	let r = sqrt(w[0] * w[0] + w[1] * w[1] + w[2] * w[2]);
	if r < 1e-9 || a == 0.0 || !(depth > 0.0) { return 0; }
	let e = [w[0] / r, w[1] / r, w[2] / r];
	let t = [n[1] * e[2] - n[2] * e[1], n[2] * e[0] - n[0] * e[2], n[0] * e[1] - n[1] * e[0]];
	let th = a * PI / 180.0;
	let b = atan2(r * th, depth);
	var u = [0.0; 3];
	for i in 3 { u[i] = t[i] * cos(b) - n[i] * sin(b); }
	let xe = x[0] * e[0] + x[1] * e[1] + x[2] * e[2];
	let xt = x[0] * t[0] + x[1] * t[1] + x[2] * t[2];
	let ye = y[0] * e[0] + y[1] * e[1] + y[2] * e[2];
	let yt = y[0] * t[0] + y[1] * t[1] + y[2] * t[2];
	var X = [0.0; 3];
	var Y = [0.0; 3];
	for i in 3 {
		X[i] = e[i] * xe + u[i] * xt;
		Y[i] = e[i] * ye + u[i] * yt;
	}
	let N = [X[1] * Y[2] - X[2] * Y[1], X[2] * Y[0] - X[0] * Y[2], X[0] * Y[1] - X[1] * Y[0]];
	for i in 3 {
		Q[i] = c[i] - cu * X[i] - cv * Y[i];
		Q[3 + i] = X[i];
		Q[6 + i] = N[i];
		Q[12 + i] = p[i];
		Q[15 + i] = e[i];
	}
	Q[9] = r;
	Q[10] = depth * 360.0 / abs(a);
	Q[11] = if a < 0.0 { 1.0 } else { 0.0 };
	1
}
