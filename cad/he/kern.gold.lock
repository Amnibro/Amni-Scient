export fn kn_tight(n i32, tol real) i32 {
	if n == 0 { return 0; }
	let count = n as int;
	for k in 3 {
		var lo = VX[k];
		var hi = VX[k];
		for i in 1..count {
			let v = VX[3 * i + k];
			lo = min(lo, v);
			hi = max(hi, v);
		}
		if BB[k] < lo - 2.0 * tol { BB[k] = lo; }
		if BB[3 + k] > hi + 2.0 * tol { BB[3 + k] = hi; }
	}
	1
}
