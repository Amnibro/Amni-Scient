export fn kn_twist(mode i32, dir i32, depth real, turns real, pitch real, angle real, left i32, cx real, cy real) i32 {
	var a = if mode == 1 {
		turns * 360.0
	} else if mode == 2 {
		if pitch > 0.0 { depth / pitch * 360.0 } else { 0.0 }
	} else if mode == 3 {
		angle
	} else {
		0.0
	};
	if left == 1 { a = -a; }
	let s = if dir == 1 { depth } else if dir == 2 { depth / 2.0 } else { 0.0 };
	OUT[0] = a;
	OUT[1] = if depth == 0.0 { 0.0 } else { -a * s / depth };
	let y = [F[7] * F[5] - F[8] * F[4], F[8] * F[3] - F[6] * F[5], F[6] * F[4] - F[7] * F[3]];
	for i in 3 {
		let start = F[i] - F[6 + i] * s;
		OUT[2 + i] = start;
		OUT[5 + i] = start + cx * F[3 + i] + cy * y[i];
	}
	if a != 0.0 { 1 } else { 0 }
}
