fn inf() real { let z = 0.0; 1.0 / z }
fn jmin(a real, b real) real {
	if a != a || b != b { return nan(); }
	if a == b {
		if 1.0 / a < 0.0 { return a; }
		return b;
	}
	if a < b { a } else { b }
}
fn jmax(a real, b real) real {
	if a != a || b != b { return nan(); }
	if a == b {
		if 1.0 / a < 0.0 { return b; }
		return a;
	}
	if a > b { a } else { b }
}
fn hyp3(a real, b real, c real) real {
	var mx = 0.0;
	if a == a && abs(a) > mx { mx = abs(a); }
	if b == b && abs(b) > mx { mx = abs(b); }
	if c == c && abs(c) > mx { mx = abs(c); }
	if mx == inf() { return inf(); }
	if a != a || b != b || c != c { return nan(); }
	if mx == 0.0 { return 0.0; }
	var sum = 0.0;
	var comp = 0.0;
	let vs real[3] = [abs(a), abs(b), abs(c)];
	for i in 3 {
		let nv = vs[i] / mx;
		let su = nv * nv - comp;
		let pre = sum + su;
		comp = (pre - sum) - su;
		sum = pre;
	}
	sqrt(sum) * mx
}
