export fn nt_build() {
	for k in 3 {
		LO[k] = 1e30;
		HI[k] = -1e30;
	}
	for i in NP {
		let k = i % 3;
		LO[k] = jmin(LO[k], POS[i]);
		HI[k] = jmax(HI[k], POS[i]);
	}
	let mx = jmax(jmax(HI[0] - LO[0], HI[1] - LO[1]), HI[2] - LO[2]);
	HH = mx / jmax(4.0, nt_cbrt(NT as real) * 1.5);
	for k in 3 {
		let g = jmax(1.0, ceil((HI[k] - LO[k]) / HH) + 1.0);
		if g != g { NXA[k] = 1; } else { NXA[k] = g as i32; }
	}
	let nc = (NXA[0] as int) * (NXA[1] as int) * (NXA[2] as int);
	CS.clear();
	CS.resize(nc + 1, 0);
	for t in NT {
		let a = 3 * (IDX[3 * t] as int);
		let b = 3 * (IDX[3 * t + 1] as int);
		let c = 3 * (IDX[3 * t + 2] as int);
		let u0 = POS[b] - POS[a];
		let u1 = POS[b + 1] - POS[a + 1];
		let u2 = POS[b + 2] - POS[a + 2];
		let v0 = POS[c] - POS[a];
		let v1 = POS[c + 1] - POS[a + 1];
		let v2 = POS[c + 2] - POS[a + 2];
		let n real[3] = [u1 * v2 - u2 * v1, u2 * v0 - u0 * v2, u0 * v1 - u1 * v0];
		var l = hyp3(n[0], n[1], n[2]);
		if l == 0.0 || l != l { l = 1.0; }
		for k in 3 {
			FN[3 * t + k] = n[k] / l;
			VN[a + k] += n[k];
			VN[b + k] += n[k];
			VN[c + k] += n[k];
		}
		cells(t, false);
	}
	for i in nc {
		CS[i + 1] += CS[i];
	}
	CL.clear();
	CL.resize(CS[nc] as int, 0);
	CC.clear();
	CC.resize(nc, 0);
	for i in nc {
		CC[i] = CS[i];
	}
	for t in NT {
		cells(t, true);
	}
