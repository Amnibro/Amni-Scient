fn tri(t int, p0 real, p1 real, p2 real) real {
	let a = 3 * (IDX[3 * t] as int);
	let b = 3 * (IDX[3 * t + 1] as int);
	let c = 3 * (IDX[3 * t + 2] as int);
	let A real[3] = [POS[a], POS[a + 1], POS[a + 2]];
	let ab real[3] = [POS[b] - A[0], POS[b + 1] - A[1], POS[b + 2] - A[2]];
	let ac real[3] = [POS[c] - A[0], POS[c + 1] - A[1], POS[c + 2] - A[2]];
	let p real[3] = [p0, p1, p2];
	let ap real[3] = [p0 - A[0], p1 - A[1], p2 - A[2]];
	let d1 = dot3(ab, ap);
	let d2 = dot3(ac, ap);
	let aa = dot3(ab, ab);
	let bb = dot3(ac, ac);
	let cc = dot3(ab, ac);
	let den = aa * bb - cc * cc;
	var v = (bb * d1 - cc * d2) / den;
	var w = (aa * d2 - cc * d1) / den;
	if !(v >= 0.0 && w >= 0.0 && v + w <= 1.0) {
		var be = inf();
		var bv = 0.0;
		var bw = 0.0;
		for e in 3 {
			let s00 = SE[4 * e];
			let s01 = SE[4 * e + 1];
			let s10 = SE[4 * e + 2];
			let s11 = SE[4 * e + 3];
			var P0 real[3] = [0.0; 3];
			var D real[3] = [0.0; 3];
			for k in 3 {
				P0[k] = (A[k] + s00 * ab[k]) + s01 * ac[k];
				D[k] = (s10 - s00) * ab[k] + (s11 - s01) * ac[k];
			}
			let r real[3] = [p0 - P0[0], p1 - P0[1], p2 - P0[2]];
			let tt = jmax(0.0, jmin(1.0, dot3(r, D) / dot3(D, D)));
			var q real[3] = [0.0; 3];
			for k in 3 {
				q[k] = P0[k] + tt * D[k];
			}
			let dd = ((p0 - q[0]) * (p0 - q[0]) + (p1 - q[1]) * (p1 - q[1])) + (p2 - q[2]) * (p2 - q[2]);
			if dd < be {
				be = dd;
				bv = s00 + tt * (s10 - s00);
				bw = s01 + tt * (s11 - s01);
			}
		}
		v = bv;
		w = bw;
	}
	var Q real[3] = [0.0; 3];
	for k in 3 {
		Q[k] = (A[k] + v * ab[k]) + w * ac[k];
		TQ[k] = Q[k];
	}
	TW[0] = (1.0 - v) - w;
	TW[1] = v;
	TW[2] = w;
	((p0 - Q[0]) * (p0 - Q[0]) + (p1 - Q[1]) * (p1 - Q[1])) + (p2 - Q[2]) * (p2 - Q[2])
}
