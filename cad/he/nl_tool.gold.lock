export fn nt_sdf(x0 real, x1 real, x2 real) {
	let x real[3] = [x0, x1, x2];
	var bd real[3] = [0.0; 3];
	for k in 3 {
		if x[k] < LO[k] { bd[k] = x[k] - LO[k]; }
		else if x[k] > HI[k] { bd[k] = x[k] - HI[k]; }
		else { bd[k] = 0.0; }
	}
	let db = hyp3(bd[0], bd[1], bd[2]);
	if db > 2.0 * HH {
		RS[1] = bd[0] / db;
		RS[2] = bd[1] / db;
		RS[3] = bd[2] / db;
		RS[0] = db;
		return;
	}
	let ci0 = toi((x0 - LO[0]) / HH);
	let ci1 = toi((x1 - LO[1]) / HH);
	let ci2 = toi((x2 - LO[2]) / HH);
	BEST = inf();
	BT = -1;
	let nx0 = NXA[0] as int;
	let nx1 = NXA[1] as int;
	let nx2 = NXA[2] as int;
	let nr = max(max(nx0, nx1), nx2) + 1;
	for ring in nr {
		for i in (ci0 - ring)..(ci0 + ring + 1) {
			if i < 0 || i >= nx0 { continue; }
			for j in (ci1 - ring)..(ci1 + ring + 1) {
				if j < 0 || j >= nx1 { continue; }
				if abs(i - ci0) == ring || abs(j - ci1) == ring {
					for k in (ci2 - ring)..(ci2 + ring + 1) {
						if k >= 0 && k < nx2 {
							look((k * nx1 + j) * nx0 + i, x0, x1, x2);
						}
					}
				} else {
					let k1 = ci2 - ring;
					if k1 >= 0 && k1 < nx2 {
						look((k1 * nx1 + j) * nx0 + i, x0, x1, x2);
					}
					if ring > 0 {
						let k2 = ci2 + ring;
						if k2 >= 0 && k2 < nx2 {
							look((k2 * nx1 + j) * nx0 + i, x0, x1, x2);
						}
					}
				}
			}
		}
		let rr = ring as real;
		if BT >= 0 && BEST < ((rr * HH) * rr) * HH { break; }
	}
	if BT == -1 {
		RS[0] = inf();
		RS[1] = 0.0;
		RS[2] = 0.0;
		RS[3] = 0.0;
		return;
	}
	let d = sqrt(BEST);
	var dx real[3] = [0.0; 3];
	var pn real[3] = [0.0; 3];
	for k in 3 {
		dx[k] = x[k] - BC[k];
		pn[k] = 0.0;
		for q in 3 {
			pn[k] += BW[q] * VN[(IDX[3 * BT + q] as int) * 3 + k];
		}
	}
	let inside = ((dx[0] * pn[0] + dx[1] * pn[1]) + dx[2] * pn[2]) < 0.0;
	let face = BW[0] > 1e-6 && BW[1] > 1e-6 && BW[2] > 1e-6;
	for k in 3 {
		if face || d < 1e-9 {
			RS[1 + k] = FN[3 * BT + k];
		} else {
			let s = if inside { -dx[k] } else { dx[k] };
			RS[1 + k] = s / d;
		}
	}
	RS[0] = if inside { -d } else { d };
}
