fn csv_field(out byte[>..]&, s const byte[:]) {
	var q = s.len > 0 && (s[0] == 32 || s[s.len - 1] == 32);
	for c in s {
		if c == ',' || c == '"' || c == 13 || c == 10 { q = true; }
	}
	if !q {
		out.append(s);
		return;
	}
	out.push('"');
	for c in s {
		if c == '"' { out.push('"'); }
		out.push(c);
	}
	out.push('"');
}
fn crlf(out byte[>..]&) {
	out.push(13);
	out.push(10);
}
fn csv_bom() {
	OUT.push(239);
	OUT.push(187);
	OUT.push(191);
}
fn num7(out byte[>..]&, v real) {
	if v != v || v - v != 0.0 { return; }
	if v == 0.0 {
		out.push('0');
		return;
	}
	let a = abs(v);
	var e = 0;
	var p = 1.0;
	if a >= 1.0 {
		while p * 10.0 <= a {
			p *= 10.0;
			e++;
		}
	} else {
		while p > a {
			p /= 10.0;
			e--;
		}
	}
	let d = clamp(6 - e, 0, 15);
	let s = out.len;
	format_flt(out, v, d);
	trim_num(out, s);
}
