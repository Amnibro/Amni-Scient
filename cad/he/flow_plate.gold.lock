			let u int = UID[p];
			if u < 0 { continue; }
			var dg = 0.0;
			for t in 0..4 {
				var q = -1;
				if t == 0 {
					if i > 0 { q = p - 1; }
				} else if t == 1 {
					if i < NA - 1 { q = p + 1; }
				} else if t == 2 {
					if j > 0 { q = p - NA; }
				} else {
					if j < NB - 1 { q = p + NA; }
				}
				if q < 0 { continue; }
				if ACT[q] == 0 { continue; }
				let x = CE[p];
				let y = CE[q];
				var T = 0.0;
				if x > 0.0 && y > 0.0 { T = ((2.0 * x) * y) / (x + y); }
