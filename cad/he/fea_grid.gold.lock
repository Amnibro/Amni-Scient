fn matvec(l int, x real[:], y real[:], raw bool) {
	let nd = ND;
	let m = nd * 8;
	let mm = m * m;
	let n = LS[l].nn * nd;
	let ne = LS[l].ne;
	let hk = LS[l].hasKE;
	let E = lE(l);
	let sc = lSc(l);
	let KE = lKE(l);
	for i in n { y[i] = 0.0; }
	var ue real[24] = [0.0; 24];
	var acc real[24] = [0.0; 24];
	for q in ne {
		var s = 1.0;
		if !hk { s = sc[q]; }
		for a in 8 {
			let nb int = E[8 * q + a];
			for c in nd { ue[nd * a + c] = x[nb * nd + c]; }
		}
		if hk {
			for r in m {
				var t = 0.0;
				for j in m {
					let kv real = KE[q * mm + r * m + j];
					t += kv * ue[j];
				}
				acc[r] = t;
			}
		} else {
			for r in m { acc[r] = 0.0; }
			for j in m {
				let u = ue[j];
				for r in m { acc[r] += KT[j * m + r] * u; }
			}
		}
		for a in 8 {
			let nb int = E[8 * q + a];
			for c in nd { y[nb * nd + c] += s * acc[nd * a + c]; }
		}
	}
	if LS[l].hasDadd {
		let da = lDadd(l);
		for i in n { y[i] += da[i] * x[i]; }
	}
	if !raw {
		let fix = lFix(l);
		for i in n { if fix[i] != 0 { y[i] = x[i]; } }
	}
}
