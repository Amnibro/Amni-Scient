.btn.sm{height:26px;padding:0 9px;font-size:12px;font-weight:550}
.btn.done{display:flex;width:100%;height:42px;margin-top:12px;font-size:15px;font-weight:650;letter-spacing:.01em;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 35%,transparent)}
.pickbox{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-top:6px;padding:9px 11px;border-radius:calc(8px*var(--rk,1));background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);font-size:12.5px;line-height:1.4}
.pickbox b{font-size:14px;color:var(--acc)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:8px 0}
.card h4{font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.err{color:var(--err)}.ok{color:var(--ok)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin:6px 0}
.alert{border-radius:calc(8px*var(--rk,1));padding:8px 10px;font-size:12.5px;margin:8px 0;border:1px solid}
.alert.err{background:color-mix(in srgb,var(--err) 10%,transparent);border-color:color-mix(in srgb,var(--err) 35%,transparent);color:var(--ink)}
.alert.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink)}
.alert.ok{background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:color-mix(in srgb,var(--ok) 35%,transparent);color:var(--ink)}
.ehead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ehead .ic{width:34px;height:34px;border-radius:calc(9px*var(--rk,1));display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-size:17px}
.ehead input{flex:1;font-size:15px;font-weight:600;background:transparent;border:1px solid transparent;border-radius:calc(7px*var(--rk,1));padding:4px 6px}
.ehead input:hover,.ehead input:focus{border-color:var(--line2);outline:none}
.shape{background:var(--bg2);border:1px solid var(--line);border-radius:calc(9px*var(--rk,1));padding:6px 8px;margin:6px 0}
.shape .top{display:flex;gap:6px;align-items:center}
.shape .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.shape .grid label{font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.shape .grid input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:calc(6px*var(--rk,1));padding:4px 5px;font-family:var(--mono);font-size:11.5px}
.ptrow{display:flex;gap:4px;align-items:center;margin:3px 0}.ptrow .ex{flex:1;min-width:0}
.ptrow input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:calc(6px*var(--rk,1));padding:4px 6px;font-family:var(--mono);font-size:11.5px}
.prev{width:100%;aspect-ratio:1.6;background:var(--bg);border:1px solid var(--line);border-radius:calc(9px*var(--rk,1));display:block;cursor:crosshair}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--mut)}
.kv span:nth-child(even){font-family:var(--mono);text-align:right}
#chat{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.msg{max-width:92%;padding:8px 11px;border-radius:calc(12px*var(--rk,1));font-size:13px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.s{align-self:center;color:var(--mut);font-size:11.5px;background:none;padding:2px}
.msg .acts{margin-top:6px;font-size:11.5px;color:var(--mut);font-family:var(--mono)}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 12px 8px}
.chips button{font-size:11.5px;padding:4px 9px;border-radius:calc(99px*var(--rk,1));border:1px solid var(--line2);color:var(--ink2);background:var(--bg2)}
.chips button:hover{border-color:var(--acc);color:var(--ink)}
.compose{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.compose textarea{flex:1;resize:none;height:62px;background:var(--bg2);border:1px solid var(--line);border-radius:calc(9px*var(--rk,1));padding:8px 10px;font-size:13px}
.prog{height:4px;background:var(--line);border-radius:calc(3px*var(--rk,1));overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.tagl{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.tag{font-size:11px;padding:2px 8px;border-radius:calc(99px*var(--rk,1));background:var(--acc-soft);color:var(--acc);display:inline-flex;gap:5px;align-items:center}
.tag button{color:inherit;opacity:.7}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tpl button{text-align:left;padding:10px;border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));background:var(--bg2)}
.tpl button:hover{border-color:var(--acc)}
.tpl b{display:block;font-size:13px;margin-bottom:2px}
.tpl small{color:var(--mut);font-size:11.5px}
dialog{margin:auto;border:1px solid var(--line2);border-radius:calc(14px*var(--rk,1));background:var(--panel);color:var(--ink);box-shadow:var(--shadow);max-width:min(640px,calc(100vw - 32px));width:100%;padding:0}
dialog::backdrop{background:rgba(5,8,12,.55);backdrop-filter:blur(2px)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
dialog .dh h2{font-size:15px}
dialog .db{padding:14px 16px;max-height:70vh;overflow-y:auto}
dialog .db p,dialog .db li{color:var(--ink2);margin:6px 0}
dialog .db ul{padding-left:18px}
dialog kbd{font-family:var(--mono);font-size:11px;background:var(--bg2);border:1px solid var(--line2);border-radius:calc(4px*var(--rk,1));padding:1px 5px}
#toast{position:fixed;pointer-events:none;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel);border:1px solid var(--line2);border-radius:calc(10px*var(--rk,1));padding:9px 14px;box-shadow:var(--shadow);transition:.2s;z-index:50;font-size:12.5px;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#mob{display:none}
@media (max-width:699px),((pointer:coarse) and (not (any-pointer:fine)) and (max-width:1100px)){
main{grid-template-columns:1fr}
#right .rtabs{overflow-x:auto;scrollbar-width:none}#right .rtabs button{flex:0 0 auto;padding:8px 9px 9px}
#left,#right{position:fixed;top:52px;bottom:56px;width:min(360px,92vw);z-index:20;box-shadow:var(--shadow);transition:transform .22s ease}
#left{left:0;transform:translateX(-102%)}
#right{right:0;transform:translateX(102%)}
body.showL #left,body.showR #right{transform:none}
#mob{display:flex;height:56px;flex-shrink:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#mob button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);font-size:11px}
#mob button.on{color:var(--acc)}
#mob button span{font-size:17px}
.tb .lbl,#docname{display:none}
.tb .sep{display:none}
#mprops{display:none}
}
@media (max-width:1000px){#docname{display:none}}
@media (max-width:800px){header{gap:7px;padding:0 8px}.tb>button,.menu>button{padding:0 7px}.ws button{padding:0 8px}#kstat{max-width:90px}}
@media (max-width:900px){.brand span,.tb .lbl,.tb .sep{display:none}
#kstat{font-size:0!important;width:12px!important;height:12px!important;min-width:12px!important;max-width:12px!important;padding:0!important;border-radius:50%!important;border:0!important;background:var(--mut);flex:none!important}
#kstat.ok{background:var(--ok)}#kstat.busy{background:var(--warm);animation:mpulse 1.2s ease-in-out infinite}#kstat.err{background:var(--err)}
@keyframes mpulse{50%{opacity:.35}}
}
@media (max-width:560px){.tb .opt{display:none}.pill{max-width:120px}header{gap:6px;padding:0 8px;overflow-x:clip}header>*{min-width:0}.brand span{display:none}.tb>button,.menu>button{padding:0 8px}.pill{flex-shrink:1;max-width:90px}#ui-menu,#b-theme{display:none}#b-pro{flex-shrink:0;max-width:none;padding:4px 9px}header .tb,header .brand{flex-shrink:0}#kstat{flex-shrink:1;min-width:24px}}
header,#left,#right,#ribbon,#pbar{zoom:var(--fs,1)}
.look-compact .sec{padding:7px 10px 8px}.look-compact .sec h3{margin-bottom:5px}.look-compact .feat{padding:3px 6px}.look-compact .prow{margin:1px 0}.look-compact .fld{margin:4px 0}.look-compact #ribbon .rb{min-height:0}.look-compact .tb>button,.look-compact .menu>button{height:28px}
</style>
</head>
<body>
<header>
<a class="brand" href="/" title="Amni-Scient home"><svg viewBox="0 0 64 64"><path class="mk" d="M32 8 54 20.5v23L32 56 10 43.5v-23z" fill="none" stroke="var(--acc)" stroke-width="4.5" stroke-linejoin="round"/><path class="mk2" d="M10 20.5 32 33l22-12.5M32 33v23" fill="none" stroke="var(--acc)" stroke-width="3.2" stroke-linejoin="round" opacity=".55"/></svg><span>Amni<b>CAD</b></span></a>
<input id="docname" aria-label="Document name" value="Untitled part" spellcheck="false">
<div class="seg ws" id="ws" role="tablist" aria-label="Workspace"><button data-ws="part" class="on" title="Parametric part modeling">Part</button><button data-ws="form" title="Organic sculpting and animation">Form</button><button data-ws="asm" title="Assemblies: components, mates, explode and interference">Assembly</button><button data-ws="tool" title="Tooling: molds, die-casting dies and casting patterns">Tooling</button></div>
<div class="tb">
<div class="menu" id="m-file"><button title="File"><span>▤</span><span class="lbl">File</span></button><div class="pop">
<button data-act="new">New part<small>Start from scratch or a template</small></button>
<button data-act="open">Open…<small>.amnicad design file</small></button>
<button data-act="save">Save<small>Download as .amnicad</small></button>
<button data-act="import">Import STEP…<small>Bring in a part from other CAD</small></button>
<button data-act="share">Copy share link<small>The design travels inside the link</small></button>
<button data-act="recover">Recover…<small>Your last 7 designs, kept in this browser</small></button>
</div></div>
<div class="menu" id="m-exp"><button title="Export"><span>⇪</span><span class="lbl">Export</span></button><div class="pop">
<button data-act="step">STEP (.step)<small>Exact solid for any CAD/CAM</small></button>
<button data-act="brep">BREP (.brep)<small>Exact OpenCascade solid</small></button>
<button data-act="stl">STL (.stl)<small>Mesh for 3D printing</small></button>
<button data-act="3mf">3MF (.3mf)<small>3D printing with units</small></button>
<button data-act="obj">OBJ (.obj)<small>Mesh for rendering</small></button>
<button data-act="glb">glTF (.glb)<small>Web, AR, Blender</small></button>
<button data-act="ply">PLY (.ply)<small>Compact binary mesh</small></button>
<button data-act="png">Image (.png)<small>Snapshot of the view</small></button>
<button data-act="render">Photo render…<small>Path-traced product shot (PNG)</small></button>
</div></div>
<span class="sep"></span>
<button id="b-undo" title="Undo (Ctrl+Z)">↶</button>
<button id="b-redo" title="Redo (Ctrl+Shift+Z)">↷</button>
</div>
<div class="hr"></div>
<button id="b-pro" class="pill pro" title="Amni-CAD Pro">Pro</button>
<span id="kstat" class="pill busy">Starting geometry kernel…</span>
<button class="ib opt" id="b-theme" title="Theme">◐</button>
<button class="ib" id="b-help" title="Help">?</button>
</header>
<main>
<aside id="left" aria-label="Design">
<div class="sec"><h3>Parameters <button id="p-add">+ Add</button></h3><div id="params"></div></div>
<div class="sec"><h3>Features <span class="mut" id="fcount"></span></h3><div id="tree"></div></div>
<div class="sec"><h3>Add feature</h3><div id="palette"></div></div>
</aside>
<div id="vp">
<canvas id="cv" tabindex="0" aria-label="3D model view"></canvas>
<div class="vtools">
<div class="grp" id="g-view"><button data-v="iso" title="Isometric (0)">Iso</button><button data-v="top" title="Top (1)">Top</button><button data-v="front" title="Front (2)">Front</button><button data-v="right" title="Right (3)">Right</button><button data-v="fit" title="Fit (F)">Fit</button></div>
<div class="grp" id="g-disp"><button data-d="edges" class="on" title="Shaded with edges">◼︎</button><button data-d="shaded" title="Shaded">●</button><button data-d="xray" title="X-ray">◌</button><button data-d="wire" title="Wireframe">▦</button></div>
<div class="grp" id="g-sec"><button id="b-sec" title="Section view">Section</button><span id="secx" style="display:none;align-items:center"><button data-ax="X">X</button><button data-ax="Y">Y</button><button data-ax="Z" class="on">Z</button><input type="range" id="secpos" min="0" max="1000" value="500" aria-label="Section position"><button id="secflip" title="Flip">⇅</button></span></div>
<div class="grp" id="g-res" style="display:none"><button data-r="model" title="Show the plain model">Model</button><button data-r="res" class="on" title="Show analysis results">Results</button><button id="b-lines" title="Streamlines on or off" style="display:none">Streamlines</button></div>
<div class="grp"><button id="b-proj" title="Toggle perspective / orthographic">Persp</button></div>
</div>
<div id="busy"><i></i><span>Building…</span></div>
<div class="chip" id="selinfo"></div>
<div class="chip" id="legend"><div id="lgt" style="font-weight:600"></div><div class="bar"></div><div class="lab"><span id="lg0"></span><span id="lg1"></span></div></div>
<div class="chip" id="mprops"></div>
<div class="chip" id="hint"><h2>Design something real</h2><p>Sketch a part from scratch, start from a template, or describe it to the AI assistant.</p><div class="row"><button class="btn pri" id="hint-new">Start from scratch</button><button class="btn" data-act="new">Templates</button><button class="btn" id="hint-ai">Ask the AI</button></div></div>
</div>
<aside id="right" aria-label="Properties">
<nav class="rtabs"><button data-tab="edit" class="on">Edit</button><button data-tab="ai">AI</button><button data-tab="sim">Stress</button><button data-tab="flow">Flow</button><button data-tab="mold">Mold</button><button data-tab="dies">Dies</button><button data-tab="draw">Drawing</button><button data-tab="make">Make</button><button data-tab="cutters">Cutters</button><button data-tab="vault">Vault</button><button data-tab="check">Review</button></nav>
<div class="tab on" id="tab-edit"></div>
<div class="tab" id="tab-ai"></div>
<div class="tab" id="tab-sim"></div>
<div class="tab" id="tab-flow"></div>
<div class="tab" id="tab-mold"></div>
<div class="tab" id="tab-dies"></div>
<div class="tab" id="tab-draw"></div>
<div class="tab" id="tab-make"></div>
<div class="tab" id="tab-cutters"></div>
<div class="tab" id="tab-vault"></div>
<div class="tab" id="tab-check"></div>
</aside>
</main>
<nav id="mob"><button data-m="L"><span>☰</span>Design</button><button data-m="V" class="on"><span>◆</span>Model</button><button data-m="R"><span>⚙</span>Panel</button></nav>
<dialog id="dlg"><div class="dh"><h2 id="dlg-t"></h2><button class="ib" id="dlg-x" aria-label="Close">✕</button></div><div class="db" id="dlg-b"></div></dialog>
<div id="toast"></div>
<input type="file" id="file" hidden>
<script type="module" src="./app.js"></script>
</body>
</html>
