<script>
(function () {
  var state = document.getElementById('state')
  var sid = new URLSearchParams(location.search).get('session_id') || ''
  function node(tag, text) {
    var el = document.createElement(tag)
    if (text != null) el.textContent = text
    return el
  }
  function fail(msg) {
    state.replaceChildren(node('h1', "I can't find a paid checkout for this link."), node('p', msg))
    var mail = node('p')
    var a = node('a', 'amnibro7@gmail.com')
    a.href = 'mailto:amnibro7@gmail.com?subject=' + encodeURIComponent('Construct Pro key ' + sid)
    mail.append(a)
    state.appendChild(mail)
  }
  function show(key) {
    var h = node('h1', "You're in. Here's your key.")
    var box = node('div')
    box.className = 'keybox'
    var val = node('div', key)
    val.className = 'keyval'
    val.id = 'pro-key-value'
    var copy = node('button', 'Copy')
    copy.className = 'cta-big'
    copy.type = 'button'
    copy.onclick = function () {
      var done = function () { copy.textContent = 'Copied' }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(key).then(done, done)
      else done()
    }
    box.append(val, copy)
    var save = node('p', "Save it somewhere you'll find it. The receipt from Stripe doesn't include it.")
    var how = node('p', 'To turn on Pro:')
    var list = document.createElement('ol')
    ;['Open any estimator (deck, roof, electrical…).', 'Tap 💼 Pro → I have a key.', 'Paste the key. Done. Do the same on your phone or tablet. One key covers 3 devices.'].forEach(function (line) { list.appendChild(node('li', line)) })
    var cancel = node('p', 'Cancel any time with the "Manage subscription" link on your Stripe receipt. Pro stays on until the end of the paid period.')
    var help = node('p')
    var a = node('a', 'amnibro7@gmail.com')
    a.href = 'mailto:amnibro7@gmail.com?subject=Construct%20Pro%20key'
    help.append('Questions or a lost key: ', a)
    var fine = node('p', "Your quotes and clients never leave your device. This page talked to Stripe and my licence server to fetch your key, and that's all.")
    fine.className = 'fine'
    state.replaceChildren(h, box, save, how, list, cancel, help, fine)
  }
  if (!/^cs_[A-Za-z0-9_]{8,255}$/.test(sid)) {
    fail('This page is the one Stripe sends you to after paying.')
    return
  }
  var base = window.AMNI_LICENSE_URL || ''
  if (!/^https:\/\//i.test(base)) {
    fail('The licence server is not connected on this site yet.')
    return
  }
  var started = Date.now()
  function poll() {
    fetch(base.replace(/\/$/, '') + '/claim?session_id=' + encodeURIComponent(sid), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j } }) })
      .then(function (r) {
        if (r.status === 200 && r.body && r.body.key) { show(r.body.key); return }
        if ((r.status === 202 || (r.body && r.body.pending)) && Date.now() - started < 60000) { setTimeout(poll, 2000); return }
        fail('If you were charged, email me the receipt and I\'ll sort it out.')
      })
      .catch(function () {
        if (Date.now() - started < 60000) setTimeout(poll, 2500)
        else fail('I could not reach the licence server. Leave this page open and reload it in a minute. Your payment is unaffected.')
      })
  }
  poll()
})()
</script>
