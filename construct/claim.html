<style>

.cta-big{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:#c8892f;color:#fff;font-weight:700;padding:0 1.2rem;border-radius:9px;border:1px solid #c8892f;cursor:pointer;font:inherit;font-size:.92rem;text-decoration:none}
.cta-big:hover{filter:brightness(1.06)}
.cta-ghost{background:transparent;color:var(--text);border-color:var(--border,rgba(127,127,127,.35))}
.claim-status{min-height:1.4em;font-size:.9rem;color:var(--dim)}

.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(200,137,47,.25);border-top-color:#c8892f;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:.6rem}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.fine{color:var(--dim);font-size:.8rem;margin-top:1.4rem;line-height:1.6}

<script>
(function () {
  var state = document.getElementById('state')
  var sid = new URLSearchParams(location.search).get('session_id') || ''
  var MAIL = 'amnibro7@gmail.com'
  var devices = Number.isFinite(window.AMNI_PRO_MAX_DEVICES) && window.AMNI_PRO_MAX_DEVICES > 0 ? window.AMNI_PRO_MAX_DEVICES : 3
  var offline = Number.isFinite(window.AMNI_PRO_OFFLINE_DAYS) && window.AMNI_PRO_OFFLINE_DAYS > 0 ? window.AMNI_PRO_OFFLINE_DAYS : 7
  var buyOpen = /^https:\/\//i.test(window.AMNI_BUY_URL || '')
  function node(tag, text, cls) { var el = document.createElement(tag); if (text != null) el.textContent = text; if (cls) el.className = cls; return el }
  function link(text, href, cls) { var a = node('a', text, cls); a.href = href; return a }
  function mail(subject) { return 'mailto:' + MAIL + '?subject=' + encodeURIComponent(subject) }
  function kicker() { return node('span', 'Construct Pro', 'claim-kicker') }
  function row() { var r = node('div', null, 'claim-row'); for (var i = 0; i < arguments.length; i++) r.appendChild(arguments[i]); return r }
  function paint() { state.replaceChildren.apply(state, [kicker()].concat([].slice.call(arguments))) }
  function intro() {
    var p = node('p', 'After you pay, Stripe sends you back to this page and your license key appears here. This visit has no checkout attached, so there is no key to show.')
    var lost = node('p'); lost.append('Bought Pro and lost your key? Email ', link(MAIL, mail('Lost Construct Pro key')), ' from the address on your Stripe receipt and I will resend it.')
    var soon = node('p', buyOpen ? 'Not a customer yet? The 14-day trial needs no card. Start it from the 💼 Pro tab in any estimator.' : 'Checkout opens soon. Until then, the 14-day trial runs with no card from the 💼 Pro tab in any estimator.')
    paint(node('h1', 'Your Pro key appears here after checkout'), p, lost, soon, row(link('See what Pro includes', 'pro.html', 'cta-big'), link('Open an estimator', '../deck/', 'cta-big cta-ghost')))
  }
  function fail(title, msg) {
    var help = node('p'); help.append('Email ', link(MAIL, mail('Construct Pro key ' + sid)), ' and include your Stripe receipt. I will send your key by hand, usually the same day.')
    paint(node('h1', title), node('p', msg), help, row(link('Back to Pro', 'pro.html', 'cta-big cta-ghost')))
  }
  function activateHere(key, status, btn) {
    var L = window.AmniProLicense, raw = window.AMNI_LICENSE_PUBKEY, pub = null
    try { pub = raw ? (typeof raw === 'string' ? JSON.parse(raw) : raw) : null } catch (e) {}
    if (!L) { status.textContent = 'Paste the key into the 💼 Pro tab instead.'; return }
    btn.disabled = true; status.className = 'claim-status'; status.textContent = 'Turning on Pro…'
    L.activateKey(key, { fetch: fetch.bind(window), storage: localStorage, licenseUrl: window.AMNI_LICENSE_URL || '', pubkey: pub }).then(function (r) {
      btn.disabled = false
      if (!r.ok) { status.className = 'claim-status bad'; status.textContent = L.messageFor(r.error, r.maxDevices || devices, offline); return }
      var ps = {}
      try { ps = JSON.parse(localStorage.getItem('amni.pro.v1')) || {} } catch (e) {}
      if (!ps || typeof ps !== 'object' || Array.isArray(ps)) ps = {}
      ps.key = r.key; ps.ent = r.entitlement; ps.sig = r.signature
      try { localStorage.setItem('amni.pro.v1', JSON.stringify(ps)) } catch (e) { status.className = 'claim-status bad'; status.textContent = "This browser couldn't save the license. Paste the key into the 💼 Pro tab instead."; return }
      status.className = 'claim-status ok'; status.textContent = 'Pro is on in this browser.'
      btn.replaceWith(link('Open an estimator', '../deck/', 'cta-big'))
    })
  }
  function show(key) {
    var box = node('div', null, 'keybox'), val = node('div', key, 'keyval'), copy = node('button', 'Copy key', 'cta-big cta-ghost')
    val.id = 'pro-key-value'; copy.type = 'button'
    copy.onclick = function () { var done = function () { copy.textContent = 'Copied' }; navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(key).then(done, function () { copy.textContent = 'Select and copy it' }) : (copy.textContent = 'Select and copy it') }
    box.append(val, copy)
    var on = node('button', 'Turn on Pro in this browser', 'cta-big'), status = node('p', '', 'claim-status')
    on.type = 'button'; status.setAttribute('role', 'status')
    on.onclick = function () { activateHere(key, status, on) }
    var list = document.createElement('ol')
    ;['Open any estimator (deck, roof, electrical and the rest).', 'Tap 💼 Pro, then Unlock Pro, then I have a key.', 'Paste the key. One key covers ' + devices + ' devices, so do the same on your phone or tablet.'].forEach(function (line) { list.appendChild(node('li', line)) })
    var help = node('p'); help.append('Lost key or questions: ', link(MAIL, mail('Construct Pro key')), '.')
    paint(node('h1', "You're in. Here's your key."), box, node('p', "Save it somewhere you'll find it. Stripe's receipt doesn't include it."), row(on), status, node('p', 'On another device:'), list, node('p', 'Cancel any time from the "Manage subscription" link on your Stripe receipt. Pro stays on until the end of the period you paid for.'), help, node('p', 'Your quotes and clients never leave your device. This page only asked Stripe and my license server for your key.', 'fine'))
  }
  if (!sid) { intro(); return }
  if (!/^cs_[A-Za-z0-9_]{8,255}$/.test(sid)) { fail("That checkout link isn't complete", 'The address is missing part of the checkout reference, so I can\'t look up the payment.'); return }
  var base = window.AMNI_LICENSE_URL || ''
  if (!/^https:\/\//i.test(base)) { fail("I can't fetch your key on this page yet", "The license server isn't connected to the site yet. Your payment is safe and nothing is lost."); return }
  var started = Date.now()
  function poll() {
    fetch(base.replace(/\/$/, '') + '/claim?session_id=' + encodeURIComponent(sid), { cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {} }).then(function (j) { return { status: r.status, body: j } }) })
      .then(function (r) {
        if (r.status === 200 && r.body && r.body.key) { show(r.body.key); return }
        if ((r.status === 202 || (r.body && r.body.pending)) && Date.now() - started < 60000) { setTimeout(poll, 2000); return }
        if (r.status === 202 || (r.body && r.body.pending)) { fail('Stripe is still confirming the payment', 'Some cards take a minute or two. Reload this page shortly. You will not be charged twice.'); return }
        fail("I can't match this checkout to a paid order", 'If you were charged, nothing is lost.')
      })
      .catch(function () {
        if (Date.now() - started < 60000) setTimeout(poll, 2500)
        else fail("I couldn't reach the license server", 'Leave this page open and reload it in a minute. Your payment is unaffected.')
      })
  }
  poll()
})()
</script>
