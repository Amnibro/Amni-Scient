name: weather-pack
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick coarse bake (faster, lower res)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  contents: write
concurrency:
  group: weather-pack
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bake Open-Meteo field pack
        run: |
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            node weather/tools/bake_fields_live.mjs --quick
          else
            node weather/tools/bake_fields_live.mjs
          fi
      - name: Commit pack if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather/data/*.f32 weather/data/manifest.json
          if git diff --staged --quiet; then
            echo "No pack changes"
            exit 0
          fi
          git commit -m "Amni-Weather: refresh Open-Meteo field pack ($(date -u +%Y-%m-%dT%H:%MZ))."
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed pack refresh"
                exit 0
              fi
            fi
            echo "push/rebase race attempt $i — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 8))
          done
          echo "Failed to push after retries"
          exit 1
