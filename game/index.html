<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amni | Amni-Scient</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
canvas { display: block; width: 100vw; height: 100vh; }
#ld { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #e8f1ff; font: 600 18px system-ui, sans-serif; background: #000; }
</style>
</head>
<body>
<canvas data-helium></canvas>
<div id="ld">Loading Amni…</div>
<script type="module">
import { start } from './helium.js';
const ld = document.getElementById('ld'), cv = document.querySelector('canvas'), q = new URLSearchParams(location.search);
if (!navigator.gpu || !WebAssembly.Suspending) { ld.textContent = 'Amni needs a browser with WebGPU and JSPI (Chrome or Edge 137+).'; throw new Error('no WebGPU/JSPI'); }
const fit = () => { const k = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(innerWidth * k); cv.height = Math.round(innerHeight * k); };
fit(); addEventListener('resize', fit);
// The game reads its art with blocking file calls, so files it asks for that are not loaded yet
// are fetched on the spot; the boot set in critical.txt is fetched up front, in parallel.
const grab = u => { const x = new XMLHttpRequest(); x.open('GET', u, false); x.overrideMimeType('text/plain; charset=x-user-defined'); x.send(); if (x.status !== 200) return null; const s = x.responseText, b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255; return b; };
class Files extends Map {
  miss = new Set();
  has(k) {
    if (super.has(k)) return true;
    if (!k.startsWith('../assets/') || this.miss.has(k)) return false;
    const b = grab('assets/' + k.slice(10));
    if (!b) { this.miss.add(k); return false; }
    super.set(k, b); return true;
  }
  get(k) { this.has(k); return super.get(k); }
}
const files = new Files(), list = (await (await fetch('critical.txt', { cache: 'no-store' })).text()).trim().split('\n');
let n = 0;
await Promise.all(list.map(async f => { const r = await fetch('assets/' + f); if (r.ok) files.set('../assets/' + f, new Uint8Array(await r.arrayBuffer())); ld.textContent = `Loading Amni… ${Math.round(100 * ++n / list.length)}%`; }));
ld.remove();
window.amni = await start({ wasm: 'app.wasm', files, canvas: cv, args: ['game', q.get('mode') || 'play', q.get('level') || 'hub'] });
</script>
</body>
</html>
