<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#14161a;--panel:#1d2026;--ink:#e8e6e0;--mut:#9aa0aa;--acc:#8fa8b8;--ok:#5fbf6e;--warn:#e0b341;--line:#2c3038}
body{background:var(--bg);color:var(--ink);font:14px system-ui;margin:0;padding:16px}
.btn{padding:7px 12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.btn.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
table{border-collapse:collapse}
</style></head><body>
<div id="sketch"></div>
<script type="module">
import { emptyScene, addNode, addRun } from './sketch.js'
import { mountSketch } from './sketch-canvas.js'
import { makePlumbTrade } from './plumb-rules.js'
import { computeHomography, applyH } from './perspective.js'
const catalog = { pex:{name:'½ in PEX (100ft)',hd:39.97}, pex34:{name:'¾ in PEX (100ft)',hd:64.97}, dwv3:{name:'3 in PVC DWV (10ft)',hd:24.97}, dwv4:{name:'4 in PVC DWV (10ft)',hd:34.97}, vent:{name:'2 in PVC vent (10ft)',hd:13.97}, trap:{name:'P-trap',hd:4.98}, stop:{name:'Angle stop',hd:8.97}, fitting:{name:'Fittings (assorted)',hd:1.98}, cleanout:{name:'Cleanout + plug',hd:12.97}, heater:{name:'Water heater',hd:549}, mainvalve:{name:'Main shutoff/PRV',hd:24.97} }
const trade = makePlumbTrade()
const scene = emptyScene(24)
const bgC = document.createElement('canvas'); bgC.width = 720; bgC.height = 460; const bx = bgC.getContext('2d')
const gr = bx.createLinearGradient(0, 0, 0, 460); gr.addColorStop(0, '#4a5563'); gr.addColorStop(1, '#5e5246'); bx.fillStyle = gr; bx.fillRect(0, 0, 720, 460)
bx.fillStyle = '#33414f'; bx.fillRect(70, 150, 150, 310); bx.strokeStyle = '#8aa0b4'; bx.lineWidth = 4; bx.strokeRect(70, 150, 150, 310)
bx.fillStyle = '#6b7c8a'; bx.fillRect(430, 120, 200, 150); bx.strokeStyle = '#aebccc'; bx.strokeRect(430, 120, 200, 150)
bx.fillStyle = 'rgba(255,255,255,.06)'; bx.fillRect(0, 380, 720, 80)
scene.bgImage = bgC.toDataURL('image/jpeg', 0.8)
scene.floorH = computeHomography([[0,0],[10,0],[10,12],[0,12]], [[320,360],[640,360],[800,560],[160,560]])
scene.floorCal = { px:[[320,360],[640,360],[800,560],[160,560]], w:10, d:12 }
const place = (type, fx, fz) => { const px = applyH(scene.floorH, [fx, fz]); addNode(scene, type, px[0], px[1], { fx, fz }) }
place('toilet', 5, 5); place('tub', 2, 8)
const ctrl = mountSketch(document.getElementById('sketch'), { scene, trade, catalog, store:'hd', onChange:()=>{} })
window.__ready = true
</script></body></html>
