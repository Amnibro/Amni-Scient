<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#14161a;--panel:#1d2026;--ink:#e8e6e0;--mut:#9aa0aa;--acc:#8fa8b8;--ok:#5fbf6e;--warn:#e0b341;--line:#2c3038}
body{background:var(--bg);color:var(--ink);font:14px system-ui;margin:0;padding:16px}
.btn{padding:7px 12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.btn.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
table{border-collapse:collapse}
</style></head><body>
<div id="sketch"></div>
<script type="module">
import { emptyScene, addNode, addRun } from './sketch.js'
import { mountSketch } from './sketch-canvas.js'
import { makeElecTrade } from './elec-rules.js'
const catalog = { nm142:{name:'14/2 NM-B (250ft)',hd:79}, nm122:{name:'12/2 NM-B (250ft)',hd:119}, nm103:{name:'10/3 NM-B (25ft)',hd:44}, nm63:{name:'6/3 NM-B (25ft)',hd:89}, recept:{name:'Receptacle',hd:1.98}, gfci:{name:'GFCI breaker/recept',hd:18.97}, afci:{name:'AFCI breaker',hd:44.97}, switch:{name:'Switch',hd:2.48}, fixture:{name:'Light fixture',hd:14.97}, box:{name:'Box',hd:1.18}, breaker:{name:'Breaker',hd:8.97}, panel:{name:'Panel',hd:169}, misc:{name:'Wire nuts/staples',hd:39} }
const trade = makeElecTrade()
const scene = emptyScene(24)
const P = addNode(scene,'panel',60,300)
// kitchen circuit (needs GFCI) - missing GFCI to show a fail
const k1 = addNode(scene,'recept',300,110,{room:'kitchen'}), k2 = addNode(scene,'recept',480,110,{room:'kitchen'})
addRun(scene,'nm122',P,k1); addRun(scene,'nm122',k1,k2)
// bedroom lighting circuit (AFCI)
const b1 = addNode(scene,'light',300,300,{room:'bedroom'}), sw = addNode(scene,'switch',480,300)
addRun(scene,'nm142',P,b1); addRun(scene,'nm142',b1,sw)
// dedicated range
const rg = addNode(scene,'range',300,490)
addRun(scene,'nm63',P,rg)
mountSketch(document.getElementById('sketch'), { scene, trade, catalog, store:'hd', onChange:()=>{} })
window.__ready = true
</script></body></html>
