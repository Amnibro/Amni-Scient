		let cmd = ct[a..];
		if starts_with(cmd, "LT") { PLD += 1; }
		if cmd.len < 2 { continue; }
		let op = cmd[..2];
		var nums real[>..] = [];
		for t in split(cmd[2..], ',') { nums.push(fval(t)); }
		if op == "SP" { let v, k = parse_int(trim(cmd[2..])); lay = if k { v - 1 } else { lay }; }
		else if op == "PU" { if nums.len >= 2 { pend = P(nums[0] / 40.0, h - nums[1] / 40.0); } }
		else if op == "PD" {
			let e = en_new(0, lay, false);
			en_pt(e, pend);
			for i in nums.len / 2 { en_pt(e, P(nums[2 * i] / 40.0, h - nums[2 * i + 1] / 40.0)); }
			let f = EN[e].first; let n = EN[e].n;
			if n >= 4 && pdist(EP[f + n - 1], EP[f]) < 0.000001 {
				EN[e].closed = true; EP.pop(); EN[e].n -= 1;
				if n - 1 == 24 {
					var c0 = P(0.0, 0.0);
					for i in 24 { c0 = padd(c0, EP[f + i]); }
					c0 = pmul(c0, 1.0 / 24.0);
					var m = 0.0;
					for i in 24 { m += pdist(EP[f + i], c0); }
					m /= 24.0;
					var okc = true;
					for i in 24 { if abs(pdist(EP[f + i], c0) - m) > 0.05 { okc = false; } }
					if okc { EP.pop_n(24); EN[e].n = 0; EN[e].kind = 1; EN[e].closed = false; en_pt(e, c0); EN[e].r = m; }
				}
			}
		}
		else if op == "SI" { if nums.len >= 2 { th = nums[1] * 10.0; } }
		else if op == "DI" { if nums.len >= 2 { rot = -atan2(nums[1], nums[0]) * 180.0 / PI; } }
		else if op == "LB" {
			let txt = cmd[2..];
			var j = 0;
			while j < txt.len && txt[j] != 3 { j += 1; }
			let e = en_new(2, lay, false);
			en_pt(e, pend);
			EN[e].r = th; EN[e].rot = rot; EN[e].tx = TB.len;
			TB.append(txt[..j]);
			EN[e].tn = j;
		}
	}
