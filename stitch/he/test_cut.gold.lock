fn lstat(layer int) {
	ST = St { loops: 0, paths: 0, circs: 0, texts: 0, perim: 0.0, x0: 0.0, y0: 0.0, x1: 0.0, y1: 0.0 };
	var got = false;
	fn ext(x real, y real) {
		if !got { ST.x0 = x; ST.x1 = x; ST.y0 = y; ST.y1 = y; got = true; }
		else { ST.x0 = min(ST.x0, x); ST.x1 = max(ST.x1, x); ST.y0 = min(ST.y0, y); ST.y1 = max(ST.y1, y); }
	}
	for e in EN {
		if layer >= 0 && e.layer != layer { continue; }
		if e.kind == 0 {
			if e.closed { ST.loops += 1; } else { ST.paths += 1; }
			for i in e.n {
				let p = EP[e.first + i];
				ext(p.x, p.y);
				if e.closed { ST.perim += pdist(p, EP[e.first + (i + 1) % e.n]); }
			}
		} else if e.kind == 1 {
			ST.circs += 1;
			let c = EP[e.first];
			ext(c.x - e.r, c.y - e.r); ext(c.x + e.r, c.y + e.r);
		} else if e.kind == 2 { ST.texts += 1; }
	}
}
