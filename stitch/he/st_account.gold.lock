fn acct_profiles(text const byte[:], ids byte[>..][>..]&, names byte[>..][>..]&, states byte[>..][>..]&) int {
	ids.clear();
	names.clear();
	states.clear();
	var r json::Doc;
	let rr, rerr = json::parse("{\"o\":{},\"a\":[],\"s\":\"\"}", r);
	let k_obj = json::kind(r, json::member(r, rr, "o"));
	let k_arr = json::kind(r, json::member(r, rr, "a"));
	let k_str = json::kind(r, json::member(r, rr, "s"));
	var d json::Doc;
	let root, err = json::parse(text, d);
	guard err.len == 0 else { return 0; }
	guard json::kind(d, root) == k_obj else { return 0; }
	let arr = json::member(d, root, "profiles");
	guard arr >= 0 else { return 0; }
	guard json::kind(d, arr) == k_arr else { return 0; }
	var count = 0;
	for i in json::count(d, arr) {
		let p = json::element(d, arr, i);
		guard p >= 0 else { continue; }
		guard json::kind(d, p) == k_obj else { continue; }
		let data = json::member(d, p, "data");
		guard data >= 0 else { continue; }
		guard json::kind(d, data) == k_obj else { continue; }
		let st = json::member(d, data, "state");
		guard st >= 0 else { continue; }
		guard json::kind(d, st) == k_str else { continue; }
		let idn = json::member(d, p, "id");
		let nn = json::member(d, p, "name");
		let a .= ids.push([]);
		if idn >= 0 { a.append(json::as_string(d, idn)); }
		let b .= names.push([]);
		if nn >= 0 { b.append(json::as_string(d, nn)); }
		let c .= states.push([]);
		c.append(json::as_string(d, st));
		count++;
	}
	return count;
}
