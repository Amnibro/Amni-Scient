fn acct_signin_url(base const byte[:], here const byte[:], out byte[>..]&) {
	out.clear();
	out.append(base);
	out.append("/?next=");
	let hex = "0123456789ABCDEF";
	for c in here {
		let keep = (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9') || c == '-' || c == '.' || c == '_' || c == '~';
		if keep {
			out.push(c);
		} else {
			out.push('%');
			out.push(hex[(c as int) >> 4]);
			out.push(hex[(c as int) & 15]);
		}
	}
}
