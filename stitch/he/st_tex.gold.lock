fn tex_square(mult real) int, int, int {
	let w = IW;
	let h = IH;
	var sum = 0.0;
	var cnt = 0;
	for i in w * h {
		if ERO[i] == 1 {
			sum += ENG[i];
			cnt += 1;
		}
	}
	if cnt == 0 { return 0, 0, 0; }
	let thr = mult * (sum / cnt);
	var prev int[>..] = [];
	var cur int[>..] = [];
	prev.resize(w, 0);
	cur.resize(w, 0);
	var best = 0;
	var bx = 0;
	var by = 0;
	for y in h {
		for x in w {
			var v = 0;
			let i = y * w + x;
			if ERO[i] == 1 && ENG[i] <= thr {
				let up = if y > 0 { prev[x] } else { 0 };
				let left = if x > 0 { cur[x - 1] } else { 0 };
				let diag = if x > 0 && y > 0 { prev[x - 1] } else { 0 };
				v = 1 + min(min(up, left), diag);
			}
			cur[x] = v;
			if v > best {
				best = v;
				bx = x;
				by = y;
			}
		}
		for x in w { prev[x] = cur[x]; }
	}
	if best == 0 { return 0, 0, 0; }
	return bx - best + 1, by - best + 1, best;
}
