fn blur_at(line real[:], i int, odd bool) real {
	let n = line.len;
	if i < 0 {
		if odd { return 2.0 * line[0] - line[min(-i, n - 1)]; }
		return line[0];
	}
	if i > n - 1 {
		if odd { return 2.0 * line[n - 1] - line[max(n - 1 - (i - (n - 1)), 0)]; }
		return line[n - 1];
	}
	return line[i];
}
fn box_blur(a real[:], w int, h int, rx int, ry int, odd bool) {
	if rx > 0 {
		var row real[>..] = [];
		for y in h {
			row.clear();
			for x in w { row.push(a[y * w + x]); }
			var s = 0.0;
			for k in -rx..rx + 1 { s += blur_at(row, k, odd); }
			for x in w {
				a[y * w + x] = s / (2 * rx + 1);
				s += blur_at(row, x + rx + 1, odd) - blur_at(row, x - rx, odd);
			}
		}
	}
	if ry > 0 {
		var col real[>..] = [];
		for x in w {
			col.clear();
			for y in h { col.push(a[y * w + x]); }
			var s = 0.0;
			for k in -ry..ry + 1 { s += blur_at(col, k, odd); }
			for y in h {
				a[y * w + x] = s / (2 * ry + 1);
				s += blur_at(col, y + ry + 1, odd) - blur_at(col, y - ry, odd);
			}
		}
	}
}
