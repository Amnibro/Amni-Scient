fn tex_period(p real[:]) real {
	let n = p.len;
	var mean = 0.0;
	for x in p { mean += x; }
	mean /= n;
	var q real[>..] = [];
	var v = 0.0;
	for x in p {
		let d = x - mean;
		q.push(d);
		v += d * d;
	}
	v /= n;
	if v == 0.0 { return 0.0; }
	let kmax = 7 * n / 10;
	var r real[>..] = [];
	r.resize(kmax + 2, 0.0);
	for k in 1..kmax + 1 {
		var s = 0.0;
		for j in n - k { s += q[j] * q[j + k]; }
		r[k] = s / ((n - k) * v);
	}
	var k0 = -1;
	for k in 1..kmax + 1 {
		if r[k] < 0.0 {
			k0 = k;
			break;
		}
	}
	if k0 < 0 { return 0.0; }
	var peaks int[>..] = [];
	var top = 0.0;
	var has = false;
	for k in (k0 + 1)..kmax {
		if r[k] >= r[k - 1] && r[k] >= r[k + 1] {
			peaks.push(k);
			if !has || r[k] > top {
				top = r[k];
				has = true;
			}
		}
	}
	if !has || top < 0.45 { return 0.0; }
	var pk = 0;
	for k in peaks {
		if r[k] >= 0.85 * top {
			pk = k;
			break;
		}
	}
	let den = r[pk - 1] - 2.0 * r[pk] + r[pk + 1];
	if den == 0.0 { return pk as real; }
	return pk + 0.5 * (r[pk - 1] - r[pk + 1]) / den;
}
