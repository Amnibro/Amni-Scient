fn tex_strip_cost(x int, y int, len int, across bool, period int, shift int) real {
	if len <= 0 { return 0.0; }
	let q = if across { max(1, round(TEX_QX) as int) } else { max(1, round(TEX_QY) as int) };
	var m0 = 0.0;
	var m1 = 0.0;
	if across {
		m0 = tex_box_mean(x, y, q, len);
		m1 = tex_box_mean(x + period, y + shift, q, len);
	} else {
		m0 = tex_box_mean(x, y, len, q);
		m1 = tex_box_mean(x + shift, y + period, len, q);
	}
	let g = if m1 == 0.0 { 1.0 } else { m0 / m1 };
	var sum = 0.0;
	for k in 4 {
		for i in len {
			var ax = 0;
			var ay = 0;
			var bx = 0;
			var by = 0;
			if across {
				ax = x + k;
				ay = y + i;
				bx = x + period + k;
				by = y + i + shift;
			} else {
				ax = x + i;
				ay = y + k;
				bx = x + i + shift;
				by = y + period + k;
			}
			let pa = (clamp(ay, 0, IH - 1) * IW + clamp(ax, 0, IW - 1)) * 4;
			let pb = (clamp(by, 0, IH - 1) * IW + clamp(bx, 0, IW - 1)) * 4;
			for c in 3 {
				let d = (IMG[pa + c] as real) - g * (IMG[pb + c] as real);
				sum += d * d;
			}
		}
	}
	return sum / (4 * len * 3);
