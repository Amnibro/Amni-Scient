fn tex_bilinear(fx real, fy real, c int) real {
	let w = IW;
	let h = IH;
	let x = clamp(fx, 0.0, w as real) - 0.5;
	let y = clamp(fy, 0.0, h as real) - 0.5;
	let xf = floor(x);
	let yf = floor(y);
	let tx = x - xf;
	let ty = y - yf;
	let x0 = clamp(xf as int, 0, w - 1);
	let x1 = clamp(xf as int + 1, 0, w - 1);
	let y0 = clamp(yf as int, 0, h - 1);
	let y1 = clamp(yf as int + 1, 0, h - 1);
	let p00 = IMG[(y0 * w + x0) * 4 + c] as real;
	let p10 = IMG[(y0 * w + x1) * 4 + c] as real;
	let p01 = IMG[(y1 * w + x0) * 4 + c] as real;
	let p11 = IMG[(y1 * w + x1) * 4 + c] as real;
	let top = p00 + (p10 - p00) * tx;
	let bot = p01 + (p11 - p01) * tx;
	return top + (bot - top) * ty;
